name: Lint and build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  sync_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sync-check
        run: pnpm sync-check

      - name: Run sync (generate files)
        run: pnpm sync

      - name: Run format
        run: pnpm format

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

      - name: Run test
        run: pnpm test
