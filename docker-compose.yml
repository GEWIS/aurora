x-pnpm-config: &pnpm-config
  environment:
    - npm_config_store_dir=/tmp/pnpm-store

volumes:
  node_modules:
  pnpm-store:

services:
  core:
    <<: *pnpm-config
    image: node:22
    entrypoint: ['node', '/app/scripts/entrypoint.ts']
    working_dir: /app
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/auth/groups']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/tmp/pnpm-store
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TZ=Europe/Amsterdam
      - TYPEORM_CONNECTION=sqlite
      - TYPEORM_DATABASE=local.sqlite
      - TYPEORM_SYNCHRONIZE=true
      - TYPEORM_LOGGING=false
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8081,http://localhost:8080
      - COOKIE_SECRET=dev-secret
      - SESSION_SECRET=dev-secret
      - LOG_LEVEL=info
      - LOG_AUDIO_BEATS=true
      - OIDC_PROVIDER=KEYCLOAK
      - ROLE_ADMIN=dev-admin
      - ROLE_BOARD=dev-board
      - ROLE_KEY_HOLDER=dev-key-holder
      - ROLE_BAC=dev-bac
      - ROLE_AVICO=dev-avico
    command: ['pnpm', '--filter', '@gewis/aurora-core', 'run', 'dev']

  client:
    <<: *pnpm-config
    image: node:22
    entrypoint: ['node', '/app/scripts/entrypoint.ts']
    working_dir: /app
    ports:
      - '8081:8081'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/tmp/pnpm-store
    depends_on:
      core:
        condition: service_healthy
    environment:
      - VITE_CORE_URL=http://core:3000
    command: ['pnpm', '--filter', '@gewis/aurora-client', 'run', 'dev']

  stream:
    <<: *pnpm-config
    build:
      context: .
      dockerfile: apps/aurora-stream/Dockerfile
      target: binaries
    entrypoint: ['node', '/app/scripts/entrypoint.ts']
    working_dir: /app
    ports:
      - '8889:8889'
      - '8554:8554'
      - '8189:8189/udp'
      - '9000:9000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/tmp/pnpm-store
    environment:
      - npm_config_store_dir=/tmp/pnpm-store
      - NODE_ENV=development
      - LOG_LEVEL=info
      - STREAM_TOKEN=dev-secret
      - CONTROL_PORT=9000
      - AUTH_PORT=9001
      - WEBRTC_PUBLIC=http://localhost:8889
      # The one address MediaMTX advertises as an ICE candidate. Must be reachable from the
      # browser, so it is the *host's* address for the published 8189/udp port, never the
      # container's own IP. Set to your LAN IP if your browser gathers no loopback candidate.
      - MTX_WEBRTCADDITIONALHOSTS=127.0.0.1
      - RTSP_PUBLIC=rtsp://localhost:8554
      - RTSP_INTERNAL=rtsp://localhost:8554
    command: ['pnpm', '--filter', '@gewis/aurora-stream', 'run', 'dev']

  backoffice:
    <<: *pnpm-config
    image: node:22
    entrypoint: ['node', '/app/scripts/entrypoint.ts']
    working_dir: /app
    ports:
      - '8080:8080'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/tmp/pnpm-store
    depends_on:
      core:
        condition: service_healthy
    environment:
      - VITE_CORE_URL=http://core:3000
      - VITE_NODE_ENV=development
    command: ['pnpm', '--filter', '@gewis/aurora-backoffice', 'run', 'dev']
